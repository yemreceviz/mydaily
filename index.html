<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Daily</title>
<meta name="theme-color" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Daily">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --accent:#2563EB; --accent-soft:#EEF2FF;
    --bg:#F4F5F7; --card:#FFFFFF; --text:#14161A; --muted:#5B6170; --line:#DDE0E5;
    --orange:#C2410C; --orange-soft:#FFF1E8; --orange-line:#FBD5BF;
    --green:#047857; --green-soft:#ECFDF5; --red:#B91C1C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;font-size:16px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none !important}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 110px)}

  /* üst kısım */
  .top{display:flex;justify-content:space-between;align-items:center}
  .date{font-size:14px;font-weight:600;color:var(--muted)}
  .iconbtn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .iconbtn:active{background:#E8EAEE}
  h1{margin:2px 0 4px;font-size:34px;font-weight:800;letter-spacing:-.5px}
  .sub{font-size:14px;color:var(--muted);min-height:20px}
  .sync{color:var(--accent)}

  /* filtreler */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* bölümler ve satırlar */
  .sec{margin-top:18px}
  .sec-h{display:flex;align-items:center;gap:6px;padding:0 4px 8px;font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
  .sec-h.assigned{color:var(--orange)}
  .sec-h.overdue{color:var(--red)}
  .sec-h button{margin-left:auto;border:none;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:4px;padding:8px 12px 8px 4px;background:var(--card);border-radius:16px;border:1px solid transparent}
  .row.as{border-color:var(--orange-line)}
  .check{width:44px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
  .ring{width:22px;height:22px;border-radius:50%;border:2px solid #C5CAD3;display:block}
  .row.as .ring{border-color:#E8834F}
  .ring.done{border:none;background:var(--accent);display:flex;align-items:center;justify-content:center}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;border:none;background:none;text-align:left;padding:4px 0}
  .t{font-size:16px;font-weight:600;overflow-wrap:anywhere}
  .row.dn .t{font-weight:500;color:#6B7280;text-decoration:line-through}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .meta .late{color:var(--red);font-weight:600}
  .badge{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--accent-soft);color:#3730A3}
  .badge.as{background:var(--orange-soft);color:var(--orange)}
  .badge.p{background:var(--green-soft);color:var(--green)}
  .bell{flex:none;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}

  /* yeni görev butonu */
  .fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(env(safe-area-inset-bottom) + 28px);width:60px;height:60px;border-radius:30px;border:none;background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(20,22,26,.22);display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.96)}

  /* alt pencere (sheet) */
  .shade{position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow-y:auto;animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .grab{width:40px;height:5px;border-radius:3px;background:#D4D7DD;margin:0 auto 12px}
  .sheet h2{margin:0 0 14px;font-size:20px;font-weight:700}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
  .inp{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  textarea.inp{min-height:80px;resize:vertical}
  .inp[readonly]{background:var(--bg);color:var(--muted)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg .chip{height:40px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:13px;color:var(--muted);line-height:1.4}
  .btn{width:100%;height:50px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
  .btn:disabled{opacity:.6}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.danger{background:transparent;color:var(--red)}
  .link{display:inline-flex;align-items:center;gap:6px;color:var(--orange);font-weight:600;font-size:15px;text-decoration:none;padding:10px 0}
  .actions{display:flex;flex-direction:column;gap:4px;margin-top:8px}

  /* giriş ekranı */
  .setup{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:420px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}
  .setup img{width:84px;height:84px;border-radius:20px}
  .setup h1{font-size:30px}
  .err{color:var(--red);font-size:14px;min-height:20px}

  .banner{background:var(--accent-soft);color:#1E3A8A;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
  .banner button{margin-left:auto;border:none;background:none;color:#1E3A8A;font-weight:700;padding:0 4px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);background:#14161A;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<section id="setup" class="setup hidden">
  <img src="icon-192.png" alt="My Daily ikonu">
  <h1 style="margin:0">My Daily'e hoş geldin</h1>
  <p class="hint" style="margin:0">Başlamak için gizli anahtarını gir. Bu işlemi her cihazda sadece bir kez yapacaksın.</p>
  <div class="field" style="margin:0">
    <label for="keyInput">Gizli anahtar</label>
    <input id="keyInput" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ör. f850d1e7…">
  </div>
  <div id="setupErr" class="err" role="alert"></div>
  <button id="connectBtn" class="btn">Bağlan</button>
</section>

<!-- ANA EKRAN -->
<main id="app" class="wrap hidden">
  <div class="top">
    <div class="date" id="today"></div>
    <div style="display:flex">
      <button class="iconbtn" id="refreshBtn" aria-label="Yenile">
        <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      </button>
      <button class="iconbtn" id="settingsBtn" aria-label="Ayarlar">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
    </div>
  </div>
  <h1>Görevlerim</h1>
  <div class="sub" id="summary"></div>
  <div id="installBanner" class="banner hidden">
    <div>iPhone'da uygulama gibi kullanmak için Safari'de alttaki <b>Paylaş</b> butonuna, sonra <b>Ana Ekrana Ekle</b>'ye dokun.</div>
    <button id="hideBanner" aria-label="Kapat">✕</button>
  </div>
  <div id="pushBanner" class="banner hidden">
    <div>Yeni görevlerden ve son tarihlerden haberdar olmak için bildirimleri aç.</div>
    <button id="pushBannerBtn" style="white-space:nowrap">Aç</button>
  </div>
  <nav class="chips" id="chips" aria-label="Filtre"></nav>
  <div id="list"></div>
</main>

<button id="fab" class="fab hidden" aria-label="Yeni görev ekle">
  <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<div id="shade" class="shade hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* =========================================================
   MY DAILY — uygulama kodu
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzOt3HhIKqlIBH5CFNsnAwnUdnxMeL99aDhqV3aGypK79gTk9TUgIlSQsk3lnDnY6C8/exec';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDrHvYc2Ou7YJjhH91MaL4BkqkuR5EfIzU',
  authDomain: 'my-daily-31c36.firebaseapp.com',
  projectId: 'my-daily-31c36',
  storageBucket: 'my-daily-31c36.firebasestorage.app',
  messagingSenderId: '291901074047',
  appId: '1:291901074047:web:75c56774d6d4fbe390ed4a'
};
const VAPID_KEY = 'BAPRqRm1L_O-C-7vxKz-mobyWO-kNbqaV9D6RSZZpQlRGY_JkRgpUN4xve5ugWjDzRq-d2Vo_PUjzMg9Si2VJbc';
const FB_VER = '10.12.2';

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let KEY = store.get('md_key', null);
let DATA = store.get('md_cache', null);   // {lists, tasks, settings}
let FILTER = 'all';
let SHOW_DONE = false;
let busy = 0;

/* ---------- tarih yardımcıları ---------- */
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayStr = () => ymd(new Date());
const tomorrowStr = () => ymd(addDays(new Date(), 1));
const trDate = (s) => { const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const shortDate = (s) => new Date(s + 'T00:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- sunucu ile konuşma ---------- */
async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({}, payload || {}, { action: action, key: KEY }))
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Bilinmeyen hata');
  return j.data;
}

function setBusy(on) { busy += on ? 1 : -1; renderSummary(); }

async function load(quiet) {
  setBusy(true);
  try {
    DATA = await api('list');
    store.set('md_cache', DATA);
    render();
  } catch (e) {
    if (String(e.message).includes('Yetkisiz')) return logout('Anahtar geçersiz, lütfen tekrar gir.');
    if (!quiet) toast('Güncellenemedi: internet bağlantını kontrol et');
  } finally { setBusy(false); }
}

/* ---------- giriş ---------- */
function showSetup(msg) {
  $('setup').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('fab').classList.add('hidden');
  $('setupErr').textContent = msg || '';
}

async function connect() {
  const k = $('keyInput').value.trim();
  if (!k) { $('setupErr').textContent = 'Anahtarı yazmalısın.'; return; }
  const btn = $('connectBtn');
  btn.disabled = true; btn.textContent = 'Bağlanıyor…'; $('setupErr').textContent = '';
  KEY = k;
  try {
    DATA = await api('list');
    store.set('md_key', KEY); store.set('md_cache', DATA);
    startApp();
  } catch (e) {
    KEY = null;
    $('setupErr').textContent = String(e.message).includes('Yetkisiz') ? 'Anahtar hatalı görünüyor, tekrar kontrol et.' : 'Bağlanılamadı. İnternet bağlantını kontrol et.';
  } finally { btn.disabled = false; btn.textContent = 'Bağlan'; }
}

function logout(msg) {
  KEY = null; DATA = null; store.del('md_key'); store.del('md_cache');
  closeSheet(); showSetup(msg);
}

function startApp() {
  $('setup').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('fab').classList.remove('hidden');
  const standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !standalone && !store.get('md_banner_hidden', false)) $('installBanner').classList.remove('hidden');
  updatePushBanner();
  render();
  load(true);
  if (pushState() === 'granted') registerPushToken().catch(() => {});
}

/* ---------- görev sınıflandırma ---------- */
function deadlineInfo(t) {
  if (!t.due) return null;
  const d = daysBetween(todayStr(), t.due);
  if (d < 0) return { text: (-d) + ' gün gecikti', late: true };
  if (d === 0) return { text: 'Bugün son gün', late: true };
  if (d === 1) return { text: 'Yarın son gün', late: false };
  return { text: d + ' gün kaldı', late: false };
}

function groups() {
  const tasks = (DATA && DATA.tasks) || [];
  const tdy = todayStr(), tmr = tomorrowStr();
  let vis = tasks;
  if (FILTER === 'assigned') vis = tasks.filter((t) => t.assigned);
  else if (FILTER !== 'all') vis = tasks.filter((t) => t.listId === FILTER && !t.assigned);

  const open = vis.filter((t) => !t.done);
  const sortFn = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.time || '99').localeCompare(b.time || '99') || a.title.localeCompare(b.title, 'tr');
  const g = { assigned: [], overdue: [], today: [], tomorrow: [], later: [], nodate: [] };
  open.forEach((t) => {
    if (t.assigned && FILTER === 'all') return g.assigned.push(t);
    if (!t.due) return g.nodate.push(t);
    if (t.due < tdy) return g.overdue.push(t);
    if (t.due === tdy) return g.today.push(t);
    if (t.due === tmr) return g.tomorrow.push(t);
    g.later.push(t);
  });
  Object.keys(g).forEach((k) => g[k].sort(sortFn));
  const done = vis.filter((t) => t.done).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
  return { g: g, done: done, openCount: open.length };
}

/* ---------- çizim ---------- */
const ICON_USERS = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg>';
const ICON_BELL = '<svg class="bell" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>';
const ICON_CHECK = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';

function listTitle(id) { const l = ((DATA && DATA.lists) || []).find((x) => x.id === id); return l ? l.title : ''; }
function isPersonal(t) { return /ki[sş]isel/i.test(t.listTitle || ''); }

function rowHTML(t) {
  const title = t.assigned && t.due ? t.title + ' — ' + trDate(t.due) : t.title;
  const meta = [];
  if (t.assigned) {
    meta.push('<span class="badge as">' + (t.assigned.surface === 'DOCUMENT' ? 'Docs' : 'Chat') + '</span>');
    const di = deadlineInfo(t);
    meta.push(di ? '<span class="' + (di.late && !t.done ? 'late' : '') + '">' + di.text + '</span>' : '<span>Son tarih yok</span>');
  } else {
    meta.push('<span class="badge' + (isPersonal(t) ? ' p' : '') + '">' + esc(t.listTitle) + '</span>');
    const parts = [];
    if (t.due) {
      const tdy = todayStr();
      if (t.due < tdy && !t.done) parts.push('<span class="late">' + shortDate(t.due) + '</span>');
      else if (t.due !== tdy && t.due !== tomorrowStr()) parts.push(shortDate(t.due));
    }
    if (t.time) parts.push(t.time);
    if (parts.length) meta.push('<span>' + parts.join(' · ') + '</span>');
  }
  if (t.notes && !t.assigned) meta.push('<span>Not var</span>');
  const bell = !t.done && t.due ? ICON_BELL : '';
  return '<div class="row' + (t.assigned ? ' as' : '') + (t.done ? ' dn' : '') + '">' +
    '<button class="check" data-toggle="' + t.id + '" aria-label="' + (t.done ? 'Tamamlanmadı olarak işaretle' : 'Tamamlandı olarak işaretle') + '">' +
      (t.done ? '<span class="ring done">' + ICON_CHECK + '</span>' : '<span class="ring"></span>') + '</button>' +
    '<button class="body" data-open="' + t.id + '"><span class="t">' + esc(title) + '</span>' +
      '<span class="meta">' + meta.join('') + '</span></button>' + bell + '</div>';
}

function section(key, label, items, cls, icon) {
  if (!items.length) return '';
  return '<section class="sec"><div class="sec-h ' + (cls || '') + '">' + (icon || '') + label + '</div><div class="rows">' + items.map(rowHTML).join('') + '</div></section>';
}

function renderSummary() {
  if (!DATA) return;
  const open = DATA.tasks.filter((t) => !t.done);
  const as = open.filter((t) => t.assigned).length;
  let s = open.length + ' açık görev' + (as ? ' · ' + as + ' tanesi sana atandı' : '');
  if (busy > 0) s += ' · <span class="sync">güncelleniyor…</span>';
  $('summary').innerHTML = s;
}

function render() {
  if (!DATA) return;
  $('today').textContent = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
  renderSummary();

  const chips = [{ id: 'all', t: 'Tümü' }]
    .concat(DATA.lists.map((l) => ({ id: l.id, t: l.title })))
    .concat([{ id: 'assigned', t: 'Atananlar' }]);
  if (!chips.some((c) => c.id === FILTER)) FILTER = 'all';
  $('chips').innerHTML = chips.map((c) => '<button class="chip' + (c.id === FILTER ? ' on' : '') + '" data-filter="' + esc(c.id) + '">' + esc(c.t) + '</button>').join('');

  const r = groups();
  let html = '';
  html += section('assigned', 'Bana atananlar', r.g.assigned, 'assigned', ICON_USERS);
  html += section('overdue', 'Gecikenler', r.g.overdue, 'overdue');
  html += section('today', 'Bugün', r.g.today);
  html += section('tomorrow', 'Yarın', r.g.tomorrow);
  html += section('later', 'Sonra', r.g.later);
  html += section('nodate', 'Tarihsiz', r.g.nodate);
  if (r.done.length) {
    html += '<section class="sec"><div class="sec-h">Tamamlananlar (' + r.done.length + ')<button id="toggleDone">' + (SHOW_DONE ? 'Gizle' : 'Göster') + '</button></div>' +
      (SHOW_DONE ? '<div class="rows">' + r.done.map(rowHTML).join('') + '</div>' : '') + '</section>';
  }
  if (!r.openCount && !r.done.length) html = '<div class="empty">Burada hiç görev yok.<br>Sağ alttaki + ile yeni görev ekleyebilirsin.</div>';
  else if (!r.openCount) html = '<div class="empty">Tüm görevler tamam, tebrikler!</div>' + html;
  $('list').innerHTML = html;
}

/* ---------- görev işlemleri ---------- */
function findTask(id) { return DATA.tasks.find((t) => t.id === id); }

async function toggleDone(id) {
  const t = findTask(id); if (!t) return;
  const old = { done: t.done, completedAt: t.completedAt };
  t.done = !t.done; t.completedAt = t.done ? new Date().toISOString() : null;
  render();
  setBusy(true);
  try { await api('update', { listId: t.listId, id: t.id, done: t.done }); store.set('md_cache', DATA); }
  catch (e) { Object.assign(t, old); render(); toast('Kaydedilemedi: ' + e.message); }
  finally { setBusy(false); }
}

/* ---------- alt pencere ---------- */
function openSheet(html) {
  $('sheet').innerHTML = '<div class="grab"></div>' + html;
  $('sheet').classList.remove('hidden'); $('shade').classList.remove('hidden');
}
function closeSheet() { $('sheet').classList.add('hidden'); $('shade').classList.add('hidden'); $('sheet').innerHTML = ''; }

function taskForm(t) {
  const isNew = !t;
  const as = t && t.assigned;
  const lists = DATA.lists;
  const defList = FILTER !== 'all' && FILTER !== 'assigned' ? FILTER : (lists[0] && lists[0].id);
  const due = t ? t.due : null;
  const tdy = todayStr(), tmr = tomorrowStr();
  const mode = !due ? 'none' : due === tdy ? 'today' : due === tmr ? 'tomorrow' : 'custom';

  let h = '<h2>' + (isNew ? 'Yeni görev' : as ? 'Atanan görev' : 'Görevi düzenle') + '</h2>';
  h += '<div class="field"><label for="fTitle">Görev</label><input id="fTitle" class="inp" maxlength="1024" placeholder="ör. Spor yap" value="' + esc(t ? t.title : '') + '"' + (as ? ' readonly' : '') + '></div>';
  if (!as || (t.assigned && t.assigned.surface !== 'DOCUMENT')) {
    h += '<div class="field"><label for="fNotes">Not</label><textarea id="fNotes" class="inp" placeholder="İsteğe bağlı detay">' + esc(t ? t.notes : '') + '</textarea></div>';
  }
  if (isNew) {
    h += '<div class="field"><label for="fList">Liste</label><select id="fList" class="inp">' +
      lists.map((l) => '<option value="' + esc(l.id) + '"' + (l.id === defList ? ' selected' : '') + '>' + esc(l.title) + '</option>').join('') + '</select></div>';
  }
  if (as) {
    h += '<div class="field"><span class="lbl">Son tarih</span><div class="inp" style="display:flex;align-items:center;background:var(--bg);color:var(--muted)">' + (t.due ? trDate(t.due) + ' · ' + DATA.settings.deadlineTime : 'Yok') + '</div></div>';
    if (t.assigned.link) h += '<a class="link" href="' + esc(t.assigned.link) + '" target="_blank" rel="noopener">Görevin atandığı yere git ↗</a>';
  } else {
    h += '<div class="field"><span class="lbl">Tarih</span><div class="seg" id="fDateSeg">' +
      ['none:Yok', 'today:Bugün', 'tomorrow:Yarın', 'custom:Tarih seç'].map((x) => { const p = x.split(':'); return '<button type="button" class="chip' + (p[0] === mode ? ' on' : '') + '" data-mode="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
      '</div></div>';
    h += '<div class="two" id="fDateRow"' + (mode === 'none' ? ' style="display:none"' : '') + '>' +
      '<div class="field"><label for="fDate">Gün</label><input id="fDate" type="date" class="inp" value="' + (due || '') + '"></div>' +
      '<div class="field"><label for="fTime">Saat</label><input id="fTime" type="time" class="inp" value="' + ((t && t.time) || '') + '"></div></div>';
    h += '<p class="hint" style="margin:-4px 0 16px">Saat seçersen 24 saat ve 2 saat önce hatırlatılacak. Bildirimleri bir sonraki adımda açacağız.</p>';
  }
  h += '<div class="actions"><button class="btn" id="fSave">' + (isNew ? 'Ekle' : 'Kaydet') + '</button>';
  if (t && !as) h += '<button class="btn danger" id="fDelete">Görevi sil</button>';
  h += '<button class="btn ghost" id="fCancel">Vazgeç</button></div>';
  openSheet(h);

  const dateRow = $('fDateRow');
  if ($('fDateSeg')) $('fDateSeg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    $('fDateSeg').querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b));
    const m = b.dataset.mode;
    dateRow.style.display = m === 'none' ? 'none' : '';
    if (m === 'today') $('fDate').value = todayStr();
    if (m === 'tomorrow') $('fDate').value = tomorrowStr();
    if (m === 'custom') { if (!$('fDate').value) $('fDate').value = todayStr(); try { $('fDate').showPicker(); } catch (er) { $('fDate').focus(); } }
    if (m === 'none') { $('fDate').value = ''; $('fTime').value = ''; }
  });
  $('fCancel').onclick = closeSheet;
  if ($('fDelete')) $('fDelete').onclick = () => deleteTask(t);
  $('fSave').onclick = () => saveTask(t);
  if (isNew) setTimeout(() => $('fTitle').focus(), 50);
}

async function saveTask(t) {
  const as = t && t.assigned;
  const title = $('fTitle').value.trim();
  if (!title) { $('fTitle').focus(); return toast('Görev adını yazmalısın'); }
  const notes = $('fNotes') ? $('fNotes').value.trim() : undefined;
  const seg = $('fDateSeg') ? $('fDateSeg').querySelector('.chip.on') : null;
  const noDate = seg && seg.dataset.mode === 'none';
  const due = as ? undefined : (noDate ? null : ($('fDate').value || null));
  const time = as ? undefined : (due ? ($('fTime').value || null) : null);
  const btn = $('fSave'); btn.disabled = true; btn.textContent = 'Kaydediliyor…';
  try {
    if (!t) {
      await api('add', { listId: $('fList').value, title: title, notes: notes, due: due, time: time });
    } else {
      const p = { listId: t.listId, id: t.id };
      if (!as) { p.title = title; p.due = due; p.time = time; }
      if (notes !== undefined) p.notes = notes;
      await api('update', p);
    }
    closeSheet();
    toast(t ? 'Kaydedildi' : 'Görev eklendi');
    load(true);
  } catch (e) {
    btn.disabled = false; btn.textContent = t ? 'Kaydet' : 'Ekle';
    toast('Kaydedilemedi: ' + e.message);
  }
}

async function deleteTask(t) {
  if (!confirm('"' + t.title + '" silinsin mi?')) return;
  try {
    await api('delete', { listId: t.listId, id: t.id });
    DATA.tasks = DATA.tasks.filter((x) => x.id !== t.id);
    store.set('md_cache', DATA);
    closeSheet(); render(); toast('Görev silindi');
  } catch (e) { toast('Silinemedi: ' + e.message); }
}

/* ---------- bildirimler ---------- */
const isStandalone = () => window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const pushSupported = () => 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
function pushState() {
  if (!pushSupported()) return isIOS() && !isStandalone() ? 'needs-install' : 'unsupported';
  return Notification.permission; // 'granted' | 'denied' | 'default'
}

let fbMessaging = null;
async function registerPushToken() {
  const reg = await navigator.serviceWorker.ready;
  if (!fbMessaging) {
    const fa = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app.js');
    const fm = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-messaging.js');
    const app = fa.getApps().length ? fa.getApp() : fa.initializeApp(FIREBASE_CONFIG);
    fbMessaging = { m: fm.getMessaging(app), getToken: fm.getToken };
  }
  const token = await fbMessaging.getToken(fbMessaging.m, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) throw new Error('Bildirim kimliği alınamadı');
  if (token !== store.get('md_push_token', null)) {
    await api('saveToken', { token: token });
    store.set('md_push_token', token);
  }
  return token;
}

async function enableNotifications(btn) {
  const st = pushState();
  if (st === 'needs-install') return toast('Önce uygulamayı ana ekrana ekle ve oradan aç');
  if (st === 'unsupported') return toast('Bu tarayıcı bildirimleri desteklemiyor');
  if (st === 'denied') return toast('Bildirim izni kapalı. Ayarlar > Bildirimler > My Daily kısmından aç');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return toast('Bildirim izni verilmedi');
  if (btn) { btn.disabled = true; btn.textContent = 'Açılıyor…'; }
  try {
    await registerPushToken();
    $('pushBanner').classList.add('hidden');
    closeSheet();
    toast('Bildirimler açıldı 🎉');
  } catch (e) {
    toast('Bildirimler açılamadı: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Bildirimleri aç'; }
  }
}

async function sendTestPush(btn) {
  btn.disabled = true; btn.textContent = 'Gönderiliyor…';
  try {
    const r = await api('testPush');
    toast(r.gonderilen ? 'Test bildirimi gönderildi, birkaç saniye içinde gelir' : 'Kayıtlı cihaz bulunamadı');
  } catch (e) { toast('Gönderilemedi: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Test bildirimi gönder'; }
}

function updatePushBanner() {
  const show = KEY && isStandalone() && pushState() === 'default';
  $('pushBanner').classList.toggle('hidden', !show);
}

/* ---------- ayarlar ---------- */
function settingsSheet() {
  const s = DATA.settings;
  const st = pushState();
  let h = '<h2>Ayarlar</h2>';
  h += '<div class="field"><span class="lbl">Bildirimler</span>';
  if (st === 'granted') {
    h += '<p class="hint" style="margin:0 0 8px">✅ Bildirimler açık. Yeni atanan görevler ve son tarihe 24 saat / 2 saat kala hatırlatma gelecek.</p>' +
      '<button class="btn ghost" id="sTestPush" style="border:1px solid var(--line)">Test bildirimi gönder</button>';
  } else if (st === 'needs-install') {
    h += '<p class="hint" style="margin:0">Bildirim alabilmek için önce uygulamayı ana ekrana ekle (Safari › Paylaş › Ana Ekrana Ekle) ve oradan aç.</p>';
  } else if (st === 'denied') {
    h += '<p class="hint" style="margin:0">Bildirim izni kapalı. iPhone Ayarlar › Bildirimler › My Daily kısmından açabilirsin.</p>';
  } else if (st === 'unsupported') {
    h += '<p class="hint" style="margin:0">Bu tarayıcı bildirimleri desteklemiyor.</p>';
  } else {
    h += '<button class="btn" id="sPush">Bildirimleri aç</button>';
  }
  h += '</div>';
  h += '<div class="field"><label for="sDeadline">Atanan görevlerde son saat (mesai bitişi)</label><input id="sDeadline" type="time" class="inp" value="' + esc(s.deadlineTime) + '"></div>';
  h += '<p class="hint" style="margin:-6px 0 16px">Son tarihi olan atanmış görevler bu saatte bitmiş sayılır. Hatırlatmalar: 24 saat ve 2 saat önce.</p>';
  h += '<button class="btn" id="sSave">Kaydet</button>';
  h += '<div class="field" style="margin-top:24px"><label for="sNewList">Yeni liste ekle</label><input id="sNewList" class="inp" placeholder="ör. Kişisel"></div>';
  h += '<button class="btn ghost" id="sAddList" style="margin-top:-8px">+ Listeyi ekle</button>';
  h += '<div class="actions" style="margin-top:16px"><button class="btn danger" id="sLogout">Bu cihazdan çıkış yap</button><button class="btn ghost" id="sClose">Kapat</button></div>';
  openSheet(h);
  if ($('sPush')) $('sPush').onclick = (e) => enableNotifications(e.currentTarget);
  if ($('sTestPush')) $('sTestPush').onclick = (e) => sendTestPush(e.currentTarget);
  $('sClose').onclick = closeSheet;
  $('sLogout').onclick = () => { if (confirm('Bu cihazdan çıkış yapılsın mı? Tekrar girmek için anahtar gerekecek.')) logout(); };
  $('sSave').onclick = async () => {
    const v = $('sDeadline').value; if (!v) return;
    try { DATA.settings = await api('saveSettings', { deadlineTime: v }); store.set('md_cache', DATA); closeSheet(); toast('Ayarlar kaydedildi'); }
    catch (e) { toast('Kaydedilemedi: ' + e.message); }
  };
  $('sAddList').onclick = async () => {
    const v = $('sNewList').value.trim(); if (!v) return $('sNewList').focus();
    try { const l = await api('addList', { title: v }); DATA.lists.push(l); store.set('md_cache', DATA); closeSheet(); render(); toast('"' + v + '" listesi eklendi'); }
    catch (e) { toast('Eklenemedi: ' + e.message); }
  };
}

/* ---------- küçük bildirim kutusu ---------- */
let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

/* ---------- olaylar ---------- */
$('connectBtn').onclick = connect;
$('keyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
$('fab').onclick = () => taskForm(null);
$('refreshBtn').onclick = () => load(false);
$('settingsBtn').onclick = settingsSheet;
$('shade').onclick = closeSheet;
$('pushBannerBtn').onclick = () => enableNotifications(null);
$('hideBanner').onclick =() => { $('installBanner').classList.add('hidden'); store.set('md_banner_hidden', true); };
$('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (b) { FILTER = b.dataset.filter; render(); } });
$('list').addEventListener('click', (e) => {
  const tg = e.target.closest('[data-toggle]'); if (tg) return toggleDone(tg.dataset.toggle);
  const op = e.target.closest('[data-open]'); if (op) return taskForm(findTask(op.dataset.open));
  if (e.target.closest('#toggleDone')) { SHOW_DONE = !SHOW_DONE; render(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && KEY) load(true); });

/* ---------- başlat ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (KEY) startApp(); else showSetup();
</script>
